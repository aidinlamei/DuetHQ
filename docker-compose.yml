services:
  postgres:
    # Exact minor on purpose: RLS and per-role grant tests must not change behaviour under a silent bump.
    # Keep in sync with PostgresFixture.Image (a test compares them). Upgrade deliberately, in its own commit.
    image: postgres:16.15
    environment:
      POSTGRES_USER: duethq
      POSTGRES_PASSWORD: duethq_dev
      POSTGRES_DB: duethq
    ports:
      - "5432:5432"
    volumes:
      - duethq-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U duethq -d duethq"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI

volumes:
  duethq-postgres-data:
