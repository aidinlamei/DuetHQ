name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    # Ubuntu runners ship with Docker, which Testcontainers (PostgreSQL) needs from P1-02 onward.
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore DuetHQ.slnx

      # -warnaserror: any warning fails the build (CLAUDE.md §5, §8).
      - name: Build
        run: dotnet build DuetHQ.slnx --configuration Release --no-restore -warnaserror

      # Container-free: every test project except DuetHQ.IntegrationTests, chosen by path (new test projects are picked up automatically).
      - name: Test (no containers)
        run: |
          projects=$(find tests -name '*.csproj' ! -path 'tests/DuetHQ.IntegrationTests/*' | sort)
          echo "$projects"
          test -n "$projects"
          status=0
          for project in $projects; do
            dotnet test "$project" --configuration Release --no-build --logger "console;verbosity=normal" || status=1
          done
          exit $status

      # Separate steps on purpose: their durations in the Actions UI show what the container costs (pull vs. start + tests).
      - name: Pull PostgreSQL image
        run: docker compose pull postgres

      - name: Integration tests (Testcontainers)
        run: dotnet test tests/DuetHQ.IntegrationTests --configuration Release --no-build --logger "console;verbosity=detailed"
