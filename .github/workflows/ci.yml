name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    # Ubuntu runners ship with Docker, which Testcontainers (PostgreSQL) needs from P1-02 onward.
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore DuetHQ.slnx

      # -warnaserror: any warning fails the build (CLAUDE.md §5, §8).
      - name: Build
        run: dotnet build DuetHQ.slnx --configuration Release --no-restore -warnaserror

      - name: Test
        run: dotnet test DuetHQ.slnx --configuration Release --no-build --logger "console;verbosity=normal"
